    let lang = "ar";

    // Theme Logic
    function setTheme(themeName) {
      document.documentElement.setAttribute('data-theme', themeName);
      localStorage.setItem('theme', themeName);

      // Update active state of buttons
      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.getAttribute('onclick').includes(themeName)) {
          btn.classList.add('active');
        }
      });
    }

    // Load saved theme
    const savedTheme = localStorage.getItem('theme') || 'default';
    setTheme(savedTheme);

    function toggleLang() {
      lang = lang === "ar" ? "en" : "ar";
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      document.querySelector('.lang-btn').innerText = lang === "ar" ? "English" : "العربية";
      updateUI();
      // Re-render current active page to update content
      const activePage = document.querySelector('.nav-item.active').getAttribute('onclick').match(/'([^']+)'/)[1];
      setPage(activePage);
    }

    function updateUI() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.innerText = STRINGS[el.dataset.i18n][lang];
      });
    }

    function cycleTheme() {
      const current = localStorage.getItem('theme') || 'default';
      const themes = ['default', 'light', 'gold'];
      const nextIndex = (themes.indexOf(current) + 1) % themes.length;
      setTheme(themes[nextIndex]);
    }

    function setPage(page) {
      // Update Active State
      document.querySelectorAll('.nav-item, .mobile-item').forEach(el => el.classList.remove('active'));

      // Find elements that link to this page and add active class
      const selector = `.nav-item[onclick*="'${page}'"], .mobile-item[onclick*="'${page}'"]`;
      document.querySelectorAll(selector).forEach(el => el.classList.add('active'));

      const app = document.getElementById('app');
      app.style.opacity = 0;

      setTimeout(() => {
        if (page === 'home') renderHome();
        else if (page === 'about') renderAbout();
        else if (page === 'orgs') renderOrgs();
        else if (page === 'media') renderMedia();
        else if (page === 'contact') renderContact();

        app.style.opacity = 1;
        window.scrollTo(0, 0);
      }, 300);
    }

    function renderHome() {
      const d = DATA.person;
      const s = DATA.stats;
      document.getElementById('app').innerHTML = `
                <section class="hero">

                        <div class="card album-card"><img src="assets/album_6.jpg" onclick="window.open(this.src)"></div>
                        <div class="card album-card"><img src="assets/album_7.jpg" onclick="window.open(this.src)"></div>
                        <div class="card album-card"><img src="assets/album_8.jpg" onclick="window.open(this.src)"></div>

      document.getElementById('year').innerText = new Date().getFullYear();
      fetchAndRenderBlogPosts();
      fetchAndRenderYouTubeVideos();

    function fetchAndRenderYouTubeVideos() {
      const videoGrid = document.getElementById('video-grid');
      // Using rss2json to fetch YouTube RSS feed
      const rssUrl = 'https://www.youtube.com/feeds/videos.xml?user=janzourcom';
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

      fetch(apiUrl)
        .then(response => response.json())
        .then(data => {
          if (data.status === 'ok' && data.items) {
            let videoHTML = '';
            // Take first 3 items
            data.items.slice(0, 3).forEach(item => {
              const title = item.title;
              const link = item.link;
              const img = item.thumbnail; // YouTube RSS provides high quality thumbnails

              videoHTML += `
                <a href="${link}" target="_blank" class="card blog-card video-card">
                    <div class="blog-thumb" style="background-image:url('${img}'); position:relative;">
                        <div style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); background:rgba(0,0,0,0.6); width:50px; height:50px; border-radius:50%; display:flex; align-items:center; justify-content:center;">
                            <i class="fa-solid fa-play" style="color:white; font-size:20px;"></i>
                        </div>
                    </div>
                    <h3>${title}</h3>
                    <span>${lang === 'ar' ? 'شاهد الفيديو' : 'Watch Video'} <i class="fa-brands fa-youtube" style="color:red;"></i></span>
                </a>
              `;
            });
            videoGrid.innerHTML = videoHTML;
          } else {
            videoGrid.innerHTML = '<p>No videos found.</p>';
          }
        })
        .catch(error => {
          console.error('Error fetching YouTube feed:', error);
          videoGrid.innerHTML = '<p>Failed to load videos.</p>';
        });
    }

    function fetchAndRenderBlogPosts() {
      const blogGrid = document.getElementById('blog-grid');
      blogGrid.innerHTML = '<p>Loading posts...</p>';

      if (lang === 'ar') {
        // Arabic: Blogger Feed (JSONP)
        window.handleBlogPosts = function (data) {
          const posts = data.feed.entry;
          let blogHTML = '';
          if (posts) {
            posts.forEach(post => {
              const title = post.title.$t;
              let link = '#';
              if (post.link) {
                const altLink = post.link.find(l => l.rel === 'alternate');
                if (altLink) link = altLink.href;
              }

              let img = 'assets/placeholder.jpg';
              if (post.media$thumbnail) {
                img = post.media$thumbnail.url.replace('s72-c', 's600');
              } else {
                const content = post.content ? post.content.$t : '';
                const imgMatch = content.match(/<img[^>]+src="([^">]+)"/);
                if (imgMatch) img = imgMatch[1];
              }

              blogHTML += createBlogCard(link, img, title);
            });
            blogGrid.innerHTML = blogHTML;
          } else {
            blogGrid.innerHTML = '<p>No posts found.</p>';
          }
        };

        const script = document.createElement('script');
        script.src = 'https://www.absi.cc/feeds/posts/default?alt=json-in-script&callback=handleBlogPosts&max-results=3';
        script.onerror = function () {
          blogGrid.innerHTML = '<p>Failed to load blog posts (Connection Error).</p>';
        };
        document.body.appendChild(script);

      } else {
        // English: Substack Feed (via rss2json)
        const rssUrl = 'https://absily.substack.com/feed';
        const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

        fetch(apiUrl)
          .then(response => response.json())
          .then(data => {
            if (data.status === 'ok' && data.items) {
              let blogHTML = '';
              // Take first 3 items
              data.items.slice(0, 3).forEach(item => {
                const title = item.title;
                const link = item.link;
                let img = item.thumbnail;

                // If no thumbnail in feed, try to extract from content
                if (!img || !img.startsWith('http')) {
                  const imgMatch = item.content.match(/<img[^>]+src="([^">]+)"/);
                  if (imgMatch) img = imgMatch[1];
                  else img = 'assets/placeholder.jpg';
                }

                blogHTML += createBlogCard(link, img, title);
              });
              blogGrid.innerHTML = blogHTML;
            } else {
              blogGrid.innerHTML = '<p>No posts found.</p>';
            }
          })
          .catch(error => {
            console.error('Error fetching Substack feed:', error);
            blogGrid.innerHTML = '<p>Failed to load blog posts.</p>';
          });
      }
    }

    function createBlogCard(link, img, title) {
      return `
        <a href="${link}" target="_blank" class="card blog-card">
            <div class="blog-thumb" style="background-image:url('${img}')"></div>
            <h3>${title}</h3>
            <span>${STRINGS.readMore[lang]} <i class="fa-solid fa-arrow-${lang === 'ar' ? 'left' : 'right'}"></i></span>
        </a>
      `;
    }

    function renderAbout() {
      let timelineHTML = '';
      DATA.timeline.forEach(item => {
        timelineHTML += `

                    <h3>${lang === 'ar' ? item.title_ar : item.title_en}</h3>

                    ${item.img ? `<img src="${item.img}" style="width:100%; max-width:300px; margin-top:10px; border-radius:8px; display:block;" onerror="this.style.display='none'">` : ''}

            </div>

      });

      document.getElementById('app').innerHTML = `
                <section class="page-section">
                    <h2>${STRINGS.about[lang]}</h2>
                    <div class="timeline">

                    </div>
                </section>
            `;
    }

    function renderOrgs() {
      let orgsHTML = '';
      DATA.orgs_data.forEach(org => {
        orgsHTML += `
            <div class="card">
                ${org.img ? `<img src="${org.img}" style="width:100%; height:150px; object-fit:contain; margin-bottom:15px;" onerror="this.style.display='none'">` : ''}

                <p style="font-size:0.9em; color:var(--text-muted); margin-top:5px;">${lang === 'ar' ? org.role_ar : org.role_en}</p>
            </div>
          `;
      });

      document.getElementById('app').innerHTML = `
                <section class="page-section">
                    <h2>${STRINGS.orgs[lang]}</h2>
                    <div class="grid">
                        ${orgsHTML}
                    </div>
                </section>
            `;
    }

    function renderMedia() {
      let achievementsHTML = '';
      DATA.achievements.forEach(ach => {
        const items = lang === 'ar' ? ach.items_ar : ach.items_en;
        const listHTML = items.map(i => `<li>${i}</li>`).join('');
        achievementsHTML += `
            <div class="card media-card">
                <i class="fa-solid ${ach.icon}"></i>
                <h3>${lang === 'ar' ? ach.title_ar : ach.title_en}</h3>
                <ul style="list-style: none; padding: 0; margin-top: 10px; font-size: 0.9em; opacity: 0.8;">
                    ${listHTML}
                </ul>
            </div>
          `;
      });

      document.getElementById('app').innerHTML = `
                <section class="page-section">
                    <h2>${STRINGS.media[lang]}</h2>
                    <div class="grid">
                        ${achievementsHTML}
                    </div>
                </section>
            `;
    }

    function renderContact() {
      document.getElementById('app').innerHTML = `
                <section class="page-section contact-page">
                    <h2>${STRINGS.contact[lang]}</h2>
                    <div class="contact-card">
                        <p><i class="fa-solid fa-envelope"></i> ${DATA.person.email}</p>
                        <div class="social-icons">
                            <a href="${DATA.social.twitter}"><i class="fa-brands fa-twitter"></i></a>
                            <a href="${DATA.social.facebook}"><i class="fa-brands fa-facebook"></i></a>
                            <a href="${DATA.social.linkedin}"><i class="fa-brands fa-linkedin"></i></a>
                        </div>
                    </div>
                </section>
            `;
    }

    // Init
    updateUI();
    renderHome();

    // --- Scroll to Top Logic ---
    const scrollTopBtn = document.getElementById("scrollTopBtn");

    window.onscroll = function () {
      if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
        scrollTopBtn.style.display = "block";
      } else {
        scrollTopBtn.style.display = "none";
      }
    };

    scrollTopBtn.onclick = function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    // --- Accessibility Logic ---
    const accessBtn = document.getElementById("accessBtn");
    const accessPanel = document.getElementById("accessPanel");

    accessBtn.onclick = function () {
      accessPanel.classList.toggle("show");
    };

    function toggleAccessClass(className) {
      document.body.classList.toggle(className);
      // Save preference
      if (document.body.classList.contains(className)) {
        localStorage.setItem(className, 'true');
      } else {
        localStorage.removeItem(className);
      }
    }

    function resetAccess() {
      ['large-text', 'gray-mode', 'high-contrast', 'underline-links'].forEach(cls => {
        document.body.classList.remove(cls);
        localStorage.removeItem(cls);
      });
    }

    // Load Accessibility Preferences
    ['large-text', 'gray-mode', 'high-contrast', 'underline-links'].forEach(cls => {
      if (localStorage.getItem(cls) === 'true') {
        document.body.classList.add(cls);
      }
    });
  </script>
